    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header panel-primary">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title">{{'Common.ChangePassword.Title' | translate }}</h4>
            </div>
            <form class="form-horizontal" ng-submit="submitChangePassword()">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">
                            {{'Common.ChangePassword.OldPassword' | translate }}
                        </label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" autocomplete="off"
                                   ng-model="changePassword.oldPassword"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">
                            {{'Common.ChangePassword.NewPassword' | translate }}
                        </label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" autocomplete="off"
                                   ng-model="changePassword.newPassword"/>
                            <span class="help-block" style="margin-bottom: 0">
                                {{'Common.ChangePassword.PasswordRule' | translate }}
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="col-sm-3 control-label">
                            {{'Common.ChangePassword.ConfirmPassword' | translate }}
                        </label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" autocomplete="off"
                                   ng-model="changePassword.confirmPassword"/>
                        </div>
                    </div>
                    <div class="form-group" ng-show="changePassword.errorMessage">
                        <div class="col-sm-8 col-sm-offset-3">
                            <span class="text-danger">{{changePassword.errorMessage}}</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">
                        {{'Common.Cancel' | translate }}
                    </button>
                    <button type="submit" class="btn btn-primary" ng-disabled="changePassword.submitting">
                        {{'Common.Ok' | translate }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
